  // Split & Hold Original
  document.getElementById('btnToggleSplit').addEventListener('click', (e) => {
    state.splitMode = !state.splitMode;
    e.currentTarget.classList.toggle('active', state.splitMode);
    canvasStack.classList.toggle('split-active', state.splitMode);
  });
  let dragSplit = false;
  const moveSplit = (cx) => {
    const r = canvasStack.getBoundingClientRect();
    const pct = Math.max(0, Math.min(100, ((cx - r.left) / r.width) * 100));
    state.splitPos = pct;
    splitDivider.style.left = `${pct}%`;
    originalOverlayCanvas.style.clipPath = `inset(0 ${100 - pct}% 0 0)`;
  };
  splitDivider.addEventListener('pointerdown', e => { e.stopPropagation(); dragSplit = true; try { splitDivider.setPointerCapture(e.pointerId); } catch {} });
  window.addEventListener('pointermove', e => { if (dragSplit) moveSplit(e.clientX); });
  window.addEventListener('pointerup', () => { dragSplit = false; });

  const holdBadge = document.getElementById('holdCompareBadge');
  let holdOriginalActive = false;
  const setHold = (on) => {
    if (holdOriginalActive === on) return;
    holdOriginalActive = on;
    canvasStack.classList.toggle('hold-active', on);
    holdBadge.style.display = on ? 'block' : 'none';
    originalOverlayCanvas.style.opacity = on ? '1' : '';
    originalOverlayCanvas.style.clipPath = on ? 'inset(0 0 0 0)' : (state.splitMode ? `inset(0 ${100 - state.splitPos}% 0 0)` : 'inset(0 50% 0 0)');
  };
  canvasStack.addEventListener('pointerdown', e => {
    if (e.target.closest('#splitDivider') || (e.button && e.button !== 0)) return;
    try { canvasStack.setPointerCapture(e.pointerId); } catch {}
    setHold(true);
  });
  canvasStack.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('pointerup', () => setHold(false));
  window.addEventListener('pointercancel', () => setHold(false));
  window.addEventListener('blur', () => setHold(false));

  // Docked Clapperboard Combo Picker (Preview / Viewfinder stays unobstructed above)
  const appShell = document.querySelector('.app-shell');
  const comboSheet = document.getElementById('comboSheetBackdrop');
  function scrollActiveTileIntoView(tabName) {
    const secMap = { camera: 'pickerSecCamera', lens: 'pickerSecLens', film: 'pickerSecFilm', saved: 'pickerSecSaved' };
    const secEl = document.getElementById(secMap[tabName || state.pickerTab] || 'pickerSecCamera');
    if (!secEl) return;
    requestAnimationFrame(() => {
      const activeTile = secEl.querySelector('.picker-tile.active');
      if (activeTile) activeTile.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    });
  }
  function closeComboPicker() {
    appShell.classList.remove('picker-open');
    comboSheet.classList.remove('open');
    requestAnimationFrame(layoutViewfinderStage);
  }
  function openComboPicker(focusSection) {
    state.pickerTab = focusSection || state.pickerTab || 'camera';
    appShell.classList.add('picker-open');
    comboSheet.classList.add('open');
    renderComboPickerSheet();
    requestAnimationFrame(layoutViewfinderStage);
    scrollActiveTileIntoView(state.pickerTab);
  }
  function setPickerTab(tab) {
    state.pickerTab = tab;
    syncPickerActiveUI();
    scrollActiveTileIntoView(tab);
  }
  document.querySelectorAll('[data-open-combo]').forEach(btn => {
    btn.addEventListener('click', () => openComboPicker(btn.dataset.openCombo));
  });
  document.querySelectorAll('.clapper-col[data-picker-tab]').forEach(col => {
    col.addEventListener('click', () => setPickerTab(col.dataset.pickerTab));
  });
  document.getElementById('btnTabSaved').addEventListener('click', () => {
    setPickerTab(state.pickerTab === 'saved' ? 'camera' : 'saved');
  });
  document.getElementById('btnRandomCombo').addEventListener('click', () => {
    const pick = arr => arr[Math.floor(Math.random() * arr.length)];
    const mode = pick(VIEWFINDER_MODES);
    const lens = pick(getModeFocals(mode.id));
    const film = pick(FILM_STOCKS);
    state.bodyId = mode.id;
    state.lensId = lens.id;
    state.filmId = film.id;
    state.filmBrandFilter = 'all';
    state.bloom = lens.bloomBase;
    state.vignette = lens.vignetteBase;
    state.grain = film.grainBase;
    state.halation = film.halationBase;
    resetHalfFramePending();
    syncAllUI();
    renderPreview();
    scrollActiveTileIntoView(state.pickerTab);
    showToast(`🎲 ${mode.name} · ${lens.label} · ${film.name}`);
  });
  document.getElementById('liveGearBadge').addEventListener('click', () => {
    if (comboSheet.classList.contains('open')) closeComboPicker();
    else openComboPicker('film');
  });
  document.getElementById('btnCloseComboSheet').addEventListener('click', closeComboPicker);
  document.getElementById('previewDropZone').addEventListener('click', e => {
    if (e.target === e.currentTarget && comboSheet.classList.contains('open')) closeComboPicker();
  });

  // Film brand filter pills inside Combo Picker
  document.querySelectorAll('#filmBrandPills .filter-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      state.filmBrandFilter = btn.dataset.fbrand;
      renderComboPickerSheet();
    });
  });

  // Collapsible Tweak Drawer events
  document.getElementById('btnCloseTweakDrawer').addEventListener('click', () => {
    document.getElementById('tweakDrawer').classList.remove('open');
    renderTweaksDock();
  });
  document.getElementById('leakTypeSelect').addEventListener('change', e => {
    state.leakType = e.target.value;
    if (state.leakType !== 'none' && state.leakAmt === 0) state.leakAmt = 45;
    renderTweaksDock(); renderPreview();
  });
  document.getElementById('activeTweakSlider').addEventListener('input', (e) => {
    state[state.activeTweakKey] = Number(e.target.value);
    renderTweaksDock();
    scheduleRender();
  });
  document.getElementById('btnResetTweaks').addEventListener('click', () => {
    const { lens, film } = getSelectedGear();
    state.strength = 100; state.exposure = 0; state.warmth = 0;
    state.grain = film.grainBase; state.halation = film.halationBase;
    state.bloom = lens.bloomBase; state.vignette = lens.vignetteBase;
    state.leakType = 'none'; state.leakAmt = 0;
    renderTweaksDock(); renderPreview();
    showToast('↺ Adjustments reset');
  });

  // Save current combo as a Recipe
  document.getElementById('btnSaveRecipe').addEventListener('click', () => {
    const { body, lens, film } = getSelectedGear();
    const name = `${body.name} • ${lens.label} • ${film.name}`;
    state.recipes.unshift({
      name, phoneId: state.phoneId, bodyId: state.bodyId, lensId: state.lensId, filmId: state.filmId,
      strength: state.strength, exposure: state.exposure, warmth: state.warmth, grain: state.grain,
      halation: state.halation, bloom: state.bloom, vignette: state.vignette,
      leakType: state.leakType, leakAmt: state.leakAmt, frameType: state.frameType, dateStamp: state.dateStamp,
      camFlashOn: state.camFlashOn
    });
    localStorage.setItem('tees_lab_recipes_v1', JSON.stringify(state.recipes));
    renderSavedRecipesList();
    syncPickerActiveUI();
    showToast(`💾 Saved combo "${name}"`);
  });

  // Bottom Sheets (Samples & Contact Sheet)
  const sampleSheet = document.getElementById('sampleSheetBackdrop');
  document.getElementById('btnOpenSamples').addEventListener('click', () => sampleSheet.classList.add('open'));
  document.getElementById('btnCloseSampleSheet').addEventListener('click', () => sampleSheet.classList.remove('open'));
  sampleSheet.addEventListener('click', e => { if (e.target === sampleSheet) sampleSheet.classList.remove('open'); });

  const contactSheet = document.getElementById('contactSheetBackdrop');
  document.getElementById('btnOpenContactSheet').addEventListener('click', () => contactSheet.classList.add('open'));
  document.getElementById('btnCloseContactSheet').addEventListener('click', () => contactSheet.classList.remove('open'));
  contactSheet.addEventListener('click', e => { if (e.target === contactSheet) contactSheet.classList.remove('open'); });

  // Camera Viewfinder HUD Events (EV Ruler, DATE toggle, FRAME toggle, Half-Frame Retake, Disposable Flash)
  const camExposureControl = document.getElementById('camExposureControl');
  camExposureControl.addEventListener('input', e => {
    state.camExposureEV = Number(e.target.value);
    syncCameraHudUI();
    scheduleCameraSettingsApply();
  });
  document.getElementById('camExposureValue').addEventListener('click', () => {
    state.camExposureEV = 0;
    syncCameraHudUI();
    scheduleCameraSettingsApply();
    showToast('EV reset to 0.0');
  });
  document.getElementById('btnVfDateToggle').addEventListener('click', () => {
    state.dateStamp = state.dateStamp === 'off' ? 'exif-or-today' : 'off';
    syncAllUI();
    renderPreview();
  });
  document.getElementById('btnVfFrameToggle').addEventListener('click', () => {
    const order = ['none', '35mm-sprocket', 'darkroom-white', 'polaroid'];
    state.frameType = order[(order.indexOf(state.frameType) + 1) % order.length];
    syncAllUI();
    renderPreview();
  });
  document.getElementById('btnVfHalfRetake').addEventListener('click', () => {
    resetHalfFramePending();
    syncCameraHudUI();
    showToast('↺ Frame 1 cleared');
  });
  document.getElementById('btnVfFlashToggle').addEventListener('click', () => {
    state.camFlashOn = !state.camFlashOn;
    syncAllUI();
    renderPreview();
    showToast(state.camFlashOn ? '⚡ Disposable Flash: ON' : '⚡ Disposable Flash: OFF');
  });

  document.getElementById('btnFlipCam').addEventListener('click', () => {
    state.camFacing = state.camFacing === 'environment' ? 'user' : 'environment';
    if (state.camStream) { stopRealCamera(); startRealCamera(); }
    else { startRealCamera(); }
  });
  document.getElementById('btnToggleSound').addEventListener('click', e => {
    state.camSound = !state.camSound;
    e.currentTarget.textContent = state.camSound ? '🔊' : '🔇';
  });
  document.getElementById('btnClearRollShots').addEventListener('click', async () => {
    try { await clearCameraRollStorage(); } catch (error) { showToast('Could not clear saved roll photos'); return; }
    state.camRollShots = []; state.camShotCount = 0;
    state.camRollId = createRollId(); saveCameraRollMeta();
    renderContactSheet(); syncCameraHudUI();
    showToast('Roll photos cleared');
  });
  document.getElementById('btnShutter').addEventListener('click', captureCameraShot);

  // Bootstrap
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    const hadController = !!navigator.serviceWorker.controller;
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (hadController && !refreshing) { refreshing = true; location.reload(); }
    });
    navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then(reg => reg.update().catch(() => {})).catch(() => {});
  }
  await loadSampleScenePhotos();
  renderSampleStrip();
  if (window.innerHeight >= 700) document.getElementById('tweakDrawer')?.classList.add('open');
  syncAllUI();
  renderContactSheet();
  cameraRollReady = restoreCameraRoll();
  loadSourceCanvas(SAMPLES[0].canvas, null);
})();
</script>
</body>
</html>
