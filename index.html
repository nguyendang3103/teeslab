<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#090a0c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <title>Tee's Lab — 35mm Film Mobile</title>
  <link rel="icon" type="image/jpeg" href="./logo.jpg" />
  <link rel="apple-touch-icon" href="./logo.jpg" />
  <link rel="manifest" href="./manifest.json" />
  <style>
    @font-face {
      font-family: 'Caveat';
      src: url('./assets/fonts/Caveat-TeeLab.woff2') format('woff2');
      font-style: normal;
      font-weight: 700;
      font-display: swap;
    }

    :root {
      --bg-void: #050608;
      --bg-shell: #0c0e12;
      --bg-dock: #14171d;
      --bg-card: #1c2028;
      --bg-elevated: #262c36;
      --bg-input: #0e1015;
      --border: #2a303c;
      --border-light: #3b4454;
      --text-primary: #f3f4f6;
      --text-secondary: #a1aab8;
      --text-muted: #6c7586;
      --cyan: #22d3ee;
      --cyan-dim: rgba(34, 211, 238, 0.14);
      --brass: #d4a359;
      --brass-dim: rgba(212, 163, 89, 0.16);
      --accent: #e86a33;
      --fuji: #10b981;
      --fuji-dim: rgba(16, 185, 129, 0.16);
      --kodak: #f59e0b;
      --kodak-dim: rgba(245, 158, 11, 0.16);
      --cinema: #06b6d4;
      --cinema-dim: rgba(6, 182, 212, 0.16);
      --danger: #ef4444;
      --mono: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Inter, sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg-void);
      color: var(--text-primary);
      font-family: var(--sans);
      font-size: 13px;
      line-height: 1.35;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: stretch;
    }

    button, input, select {
      font-family: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
      padding: 0;
    }

    /* Hide scrollbars on touch horizontal tracks */
    .h-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .h-scroll::-webkit-scrollbar { display: none; }

    /* Mobile App Shell (100dvh fixed frame) */
    .app-shell {
      width: 100%;
      max-width: 440px;
      height: 100dvh;
      max-height: 100dvh;
      background: var(--bg-shell);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      border-left: 1px solid #181c24;
      border-right: 1px solid #181c24;
      padding-top: env(safe-area-inset-top);
    }
    /* 1. COMPACT MOBILE TOPBAR */
    .topbar {
      height: 50px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 10px;
      background: #090b0e;
      border-bottom: 1px solid #1b1f27;
      z-index: 30;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .brand-logo-wrap {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      overflow: hidden;
      border: 1.5px solid rgba(34, 211, 238, 0.85);
      box-shadow: 0 0 8px rgba(34, 211, 238, 0.45), 0 0 16px rgba(34, 211, 238, 0.22);
      background: #05070a;
      flex-shrink: 0;
    }
    .brand-logo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .brand-info {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .brand-title {
      font-family: 'Caveat', cursive;
      font-weight: 700;
      font-size: 21px;
      letter-spacing: 0.2px;
      line-height: 1;
      color: #f3feff;
      paint-order: stroke fill;
      -webkit-text-stroke: 1.4px var(--cyan);
      text-shadow: 0 0 3px var(--cyan), 0 0 8px rgba(34, 211, 238, 0.9), 0 0 16px rgba(34, 211, 238, 0.55);
      white-space: nowrap;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 30px;
      padding: 0 10px;
      border-radius: 15px;
      font-size: 11.5px;
      font-weight: 700;
      white-space: nowrap;
      transition: transform 0.12s ease, background 0.15s ease;
    }
    .btn-pill:active { transform: scale(0.96); }
    .btn-ghost {
      background: #171a21;
      border: 1px solid #282d38;
      color: var(--text-primary);
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #c94e1c);
      color: #fff;
      box-shadow: 0 2px 10px rgba(232, 106, 51, 0.3);
    }
    .btn-brass {
      background: linear-gradient(135deg, #e5a93c, #c48320);
      color: #111;
      font-weight: 800;
    }
    .btn-icon-top {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #171a21;
      border: 1px solid #282d38;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: var(--text-secondary);
    }

    /* MAIN VIEWS */
    .view-section {
      display: none;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      flex-direction: column;
    }
    .view-section.active {
      display: flex;
    }

    /* ==================== ROLLIE 3-CARD COMBO DECK (SHARED PATTERN) ==================== */
    .combo-trio-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
      width: 100%;
    }
    .combo-card {
      position: relative;
      background: linear-gradient(180deg, #181a1f 0%, #121418 100%);
      border: 1px solid #282c35;
      border-radius: 10px;
      padding: 7px 6px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      text-align: center;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.04), 0 2px 6px rgba(0,0,0,0.4);
      transition: border-color 0.15s ease, transform 0.1s ease;
    }
    .combo-card:active {
      transform: scale(0.98);
      border-color: #f5a623;
    }
    #labComboTrio .combo-card {
      padding: 10px 6px 8px;
      gap: 5px;
    }
    .combo-card-tag {
      font-family: var(--mono);
      font-size: 8.5px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: #8a93a2;
      text-transform: uppercase;
    }
    .combo-card-val {
      font-size: 11px;
      font-weight: 700;
      color: #f5a623;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      line-height: 1.15;
    }
    .combo-card-caret {
      font-size: 8px;
      color: #6c7586;
      line-height: 1;
      margin-top: -2px;
    }
    .combo-card-art {
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 1px;
    }
    .combo-card-art svg,
    .combo-card-art img {
      height: 36px;
      width: auto;
      max-width: 100%;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 3px 5px rgba(0,0,0,0.55)) drop-shadow(0 0 1px rgba(255,255,255,0.16));
    }
    #labComboTrio .combo-card-art {
      height: 45px;
    }
    #labComboTrio .combo-card-art svg,
    #labComboTrio .combo-card-art img {
      height: 43px;
    }

    /* ==================== TAB 1: DARKROOM (CLEAN STAGE + COMPACT DECK) ==================== */
    .stage-area {
      flex: 1 1 auto;
      min-height: 0;
      min-width: 0;
      position: relative;
      background: #07080a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4px 4px 6px;
      overflow: hidden;
      user-select: none;
    }

    .canvas-stack {
      position: relative;
      display: inline-flex;
      max-width: 100%;
      flex: 0 1 auto;
      max-height: calc(100% - 34px);
      min-width: 0;
      min-height: 0;
      align-items: center;
      justify-content: center;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
      cursor: pointer;
    }
    #previewCanvas, #originalOverlayCanvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 2px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.75);
    }
    #originalOverlayCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      clip-path: inset(0 50% 0 0);
      opacity: 0;
    }
    .canvas-stack.split-active #originalOverlayCanvas { opacity: 1; }
    .canvas-stack.hold-active .split-divider,
    .canvas-stack.hold-active .split-tag { opacity: 0; }

    .split-divider {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 2px;
      background: #f5a623;
      display: none;
      z-index: 10;
      touch-action: none;
    }
    .canvas-stack.split-active .split-divider { display: block; }
    .split-handle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #f5a623;
      color: #111;
      font-weight: 900;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.7);
    }
    .split-tag {
      position: absolute;
      top: 6px;
      padding: 2px 6px;
      font-family: var(--mono);
      font-size: 9.5px;
      font-weight: 700;
      border-radius: 4px;
      background: rgba(0,0,0,0.75);
      color: #fff;
      display: none;
      z-index: 8;
      pointer-events: none;
    }
    .canvas-stack.split-active .split-tag { display: block; }
    .split-tag.left { left: 6px; }
    .split-tag.right { right: 6px; color: #f5a623; }

    /* Rollie-style bottom caption & subtle floating controls (hugged beneath photo) */
    .stage-overlay-bottom {
      width: 100%;
      padding: 0 6px;
      margin-top: 8px;
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      z-index: 12;
    }
    .rollie-combo-caption {
      pointer-events: auto;
      font-size: 11px;
      font-weight: 600;
      color: #d1d5db;
      letter-spacing: 0.1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 0;
      text-align: left;
    }
    .rollie-combo-caption strong {
      color: #f5a623;
      font-weight: 700;
    }
    .float-pill {
      pointer-events: auto;
      background: rgba(18, 21, 27, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-secondary);
      border-radius: 12px;
      padding: 3px 8px;
      font-size: 10px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }
    .float-pill.active {
      background: rgba(245, 166, 35, 0.18);
      color: #f5a623;
      border-color: rgba(245, 166, 35, 0.55);
    }

    .hold-badge {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(6px);
      color: #f5a623;
      border: 1px solid rgba(245, 166, 35, 0.85);
      padding: 3px 10px;
      border-radius: 14px;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      display: none;
      z-index: 16;
      pointer-events: none;
    }

    /* COMPACT LAB CONTROL DOCK */
    .tool-dock {
      flex-shrink: 0;
      background: #0d0f13;
      border-top: 1px solid #1e222b;
      padding: 9px 10px 9px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Collapsible Slider Drawer inside Lab Dock */
    .tweak-drawer {
      display: none;
      background: #14171e;
      border: 1px solid #262b36;
      border-radius: 9px;
      padding: 6px 10px 8px;
      flex-direction: column;
      gap: 5px;
    }
    .tweak-drawer.open {
      display: flex;
    }
    .tweak-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
    }
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 5px;
      border-radius: 4px;
      background: #08090c;
      border: 1px solid #2a303c;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #f5a623;
      border: 2px solid #111;
      box-shadow: 0 1px 5px rgba(0,0,0,0.7);
    }

    /* Tweak Pill Strip */
    .tweak-strip-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tweak-pills-wrap {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 5px;
      width: 100%;
    }
    .tweak-pill {
      min-width: 0;
      padding: 5px 4px;
      border-radius: 9px;
      background: #151820;
      border: 1px solid #252a35;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-size: 9px;
      font-weight: 600;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
    }
    .tweak-pill span:first-child {
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tweak-pill.active {
      border-color: #f5a623;
      background: rgba(245, 166, 35, 0.14);
      color: #fff;
    }
    .tweak-pill-val {
      font-family: var(--mono);
      font-size: 9.5px;
      font-weight: 700;
      color: #f5a623;
    }

    .dark-input, .dark-select {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-primary);
      border-radius: 7px;
      padding: 5px 8px;
      font-size: 11px;
      outline: none;
    }
    .recipe-chip {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 14px;
      background: #171a22;
      border: 1px solid #292f3b;
      font-size: 10.5px;
    }

    /* ==================== TAB 2: ROLLIE SKEUOMORPHIC 35MM CAMERA ==================== */
    .cam-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 8px 12px 10px;
      background:
        radial-gradient(rgba(255,255,255,0.03) 1px, transparent 0) 0 0 / 6px 6px,
        radial-gradient(rgba(0,0,0,0.6) 1px, transparent 0) 3px 3px / 6px 6px,
        #0c0d10;
    }

    /* Top Mechanical Camera Plate (Counter + Optical Window + Lever) */
    .cam-top-plate {
      height: 40px;
      flex-shrink: 0;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 4px;
    }
    .cam-counter-slot {
      justify-self: start;
      min-width: 48px;
      height: 24px;
      padding: 0 8px;
      border-radius: 5px;
      background: linear-gradient(180deg, #78746a 0%, #9b968b 50%, #6e6a61 100%);
      border: 2px solid #26282e;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.65), 0 1px 0 rgba(255,255,255,0.08);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--mono);
      font-weight: 800;
      font-size: 12px;
      color: #161616;
      letter-spacing: 0.5px;
    }
    .cam-optical-eye {
      width: 52px;
      height: 36px;
      border-radius: 8px;
      background: linear-gradient(180deg, #1b1d22, #0d0e11);
      border: 2px solid #2b2f38;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.9), 0 2px 6px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .cam-optical-eye::after {
      content: "";
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(120, 180, 255, 0.45), rgba(15, 23, 42, 0.95) 70%);
      border: 1.5px solid #333842;
    }
    .cam-top-right {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .cam-lever-knob {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: conic-gradient(#d1d5db, #6b7280, #e5e7eb, #4b5563, #d1d5db);
      border: 2px solid #262930;
      box-shadow: 0 2px 6px rgba(0,0,0,0.7);
      position: relative;
    }

    /* Viewfinder Box & Mode-Specific Stages */
    .cam-vf-box {
      flex: 1;
      min-height: 0;
      margin: 6px 0 8px;
      position: relative;
      background: #040507;
      border: 2px solid #252830;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 18px rgba(0,0,0,0.85);
    }
    .vf-stage {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050608;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: width 0.16s ease, height 0.16s ease;
    }
    #cameraViewfinderCanvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .vf-overlay-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
    }

    /* Corner finder brackets (shared by Pocket 110, Half Frame Single, Disposable) */
    .vf-corner {
      position: absolute;
      width: 14px;
      height: 14px;
      border-color: rgba(255,255,255,0.72);
      border-style: solid;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease;
    }
    .vf-stage[data-vf-mode="half-frame-single"] .vf-corner,
    .vf-stage[data-vf-mode="pocket-110"] .vf-corner,
    .vf-stage[data-vf-mode="disposable"] .vf-corner { opacity: 0.78; }
    .vf-corner.tl { top: 10px; left: 10px; border-width: 1.5px 0 0 1.5px; }
    .vf-corner.tr { top: 10px; right: 10px; border-width: 1.5px 1.5px 0 0; }
    .vf-corner.bl { bottom: 10px; left: 10px; border-width: 0 0 1.5px 1.5px; }
    .vf-corner.br { bottom: 10px; right: 10px; border-width: 0 1.5px 1.5px 0; }

    /* Half-Frame Single 3:4 — Vertical Half-Frame Portrait Guide */
    .vf-hfs-overlay {
      position: absolute;
      inset: 6px;
      border: 1px solid rgba(245, 166, 35, 0.36);
      display: none;
      pointer-events: none;
    }
    .vf-stage[data-vf-mode="half-frame-single"] .vf-hfs-overlay { display: block; }
    .vf-hfs-overlay::after {
      content: "+";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: var(--mono);
      font-size: 13px;
      color: rgba(255,255,255,0.45);
    }

    /* Pocket 110 (4:3) — Simple Subminiature Oval Target */
    .vf-110-overlay {
      position: absolute;
      inset: 0;
      display: none;
      pointer-events: none;
    }
    .vf-stage[data-vf-mode="pocket-110"] .vf-110-overlay { display: block; }
    .vf-110-reticle {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 24px;
      height: 18px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.55);
    }
    .vf-110-tag {
      position: absolute;
      top: 12px;
      right: 16px;
      font-family: var(--mono);
      font-size: 8.5px;
      font-weight: 800;
      color: rgba(255,255,255,0.58);
      letter-spacing: 0.5px;
    }

    /* Disposable 35mm — Plastic Finder + Parallax Ticks + Flash Status */
    .vf-disp-overlay {
      position: absolute;
      inset: 14px;
      border: 1px dashed rgba(255, 255, 255, 0.25);
      display: none;
      pointer-events: none;
    }
    .vf-stage[data-vf-mode="disposable"] .vf-disp-overlay { display: block; }
    .vf-disp-overlay::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 14px;
      height: 14px;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(255,255,255,0.42);
      border-radius: 50%;
    }
    .vf-disp-flash-pip {
      position: absolute;
      top: 6px;
      right: 8px;
      font-family: var(--mono);
      font-size: 8.5px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 4px;
      background: rgba(245, 166, 35, 0.22);
      color: #fbbf24;
      border: 1px solid rgba(245, 166, 35, 0.65);
      opacity: 0;
      transition: opacity 0.14s ease;
    }
    .vf-disp-flash-pip.on { opacity: 1; }

    /* Medium Format 120 — Waist-Level Ground Glass Etched Grid */
    .vf-mf-overlay {
      position: absolute;
      inset: 0;
      display: none;
      pointer-events: none;
    }
    .vf-stage[data-vf-mode="medium-format"] .vf-mf-overlay { display: block; }
    .vf-mf-frame {
      position: absolute;
      inset: 6px;
      border: 1px solid rgba(255,255,255,0.34);
    }
    .vf-mf-grid-h1, .vf-mf-grid-h2 {
      position: absolute;
      left: 6px;
      right: 6px;
      height: 1px;
      background: rgba(255,255,255,0.16);
    }
    .vf-mf-grid-h1 { top: 33.33%; }
    .vf-mf-grid-h2 { top: 66.66%; }
    .vf-mf-grid-v1, .vf-mf-grid-v2 {
      position: absolute;
      top: 6px;
      bottom: 6px;
      width: 1px;
      background: rgba(255,255,255,0.16);
    }
    .vf-mf-grid-v1 { left: 33.33%; }
    .vf-mf-grid-v2 { left: 66.66%; }
    .vf-mf-loupe {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 58px;
      height: 58px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.48);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.28);
    }
    .vf-mf-loupe::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 6px;
      height: 6px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.68);
    }

    /* SLR 3:2 — Split-Prism Focusing Circle + Classic LED Exposure Meter */
    .vf-slr-overlay {
      position: absolute;
      inset: 0;
      display: none;
      pointer-events: none;
    }
    .vf-stage[data-vf-mode="slr"] .vf-slr-overlay { display: block; }
    .vf-slr-matte {
      position: absolute;
      inset: 6px;
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 2px;
    }
    .vf-slr-focus-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 66px;
      height: 66px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.45);
      box-shadow: 0 0 0 10px rgba(0,0,0,0.06) inset;
    }
    .vf-slr-microprism {
      position: absolute;
      inset: 7px;
      border-radius: 50%;
      border: 1px dashed rgba(255,255,255,0.42);
      background: radial-gradient(circle, transparent 58%, rgba(255,255,255,0.06) 59%, transparent 62%);
    }
    .vf-slr-split {
      position: absolute;
      inset: 14px;
      border-radius: 50%;
      border: 1.2px solid rgba(255,255,255,0.72);
      overflow: hidden;
    }
    .vf-slr-split::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 1px;
      background: rgba(255,255,255,0.85);
      box-shadow: 0 0 3px rgba(0,0,0,0.75);
    }
    .vf-slr-led-bar {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 6px 5px;
      border-radius: 10px;
      background: rgba(8, 10, 14, 0.72);
      border: 1px solid rgba(255,255,255,0.14);
      backdrop-filter: blur(3px);
    }
    .vf-led-row {
      display: flex;
      align-items: center;
      gap: 3px;
      font-family: var(--mono);
      font-size: 8px;
      font-weight: 800;
      color: rgba(255,255,255,0.42);
    }
    .vf-led-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.16);
      border: 1px solid rgba(255,255,255,0.22);
      transition: all 0.12s ease;
    }
    .vf-led-row.lit.over .vf-led-dot { background: #ef4444; border-color: #fca5a5; box-shadow: 0 0 6px #ef4444; }
    .vf-led-row.lit.ok .vf-led-dot { background: #22c55e; border-color: #86efac; box-shadow: 0 0 7px #22c55e; }
    .vf-led-row.lit.under .vf-led-dot { background: #f59e0b; border-color: #fde68a; box-shadow: 0 0 6px #f59e0b; }
    .vf-led-row.lit { color: #fff; }

    /* Rangefinder 3:2 — Wide Field + Outside-the-frame + Resizing Brightlines */
    .vf-rf-overlay {
      position: absolute;
      inset: 0;
      display: none;
      pointer-events: none;
      align-items: center;
      justify-content: center;
    }
    .vf-stage[data-vf-mode="rangefinder"] .vf-rf-overlay { display: flex; }
    .vf-rf-brightline {
      position: relative;
      width: 70.4%;
      height: 70.4%;
      box-shadow: 0 0 0 2000px rgba(0, 0, 0, 0.34);
      border: 1px solid rgba(255, 255, 255, 0.35);
      transition: width 0.18s ease, height 0.18s ease;
    }
    .vf-rf-bracket {
      position: absolute;
      width: 14px;
      height: 14px;
      border-color: rgba(255, 250, 235, 0.96);
      border-style: solid;
      filter: drop-shadow(0 0 2px rgba(245, 166, 35, 0.45));
    }
    .vf-rf-bracket.tl { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
    .vf-rf-bracket.tr { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
    .vf-rf-bracket.bl { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; }
    .vf-rf-bracket.br { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }
    .vf-rf-patch {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 18px;
      height: 12px;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(245, 196, 81, 0.72);
      background: rgba(245, 196, 81, 0.12);
    }
    .vf-rf-focal-tag {
      position: absolute;
      top: 4px;
      left: 6px;
      font-family: var(--mono);
      font-size: 8.5px;
      font-weight: 800;
      color: rgba(255, 250, 235, 0.92);
      text-shadow: 0 1px 2px rgba(0,0,0,0.85);
    }

    /* Half-Frame (3:4 x 2) — Side-by-side Split Diptych Overlay */
    .vf-hf-overlay {
      position: absolute;
      inset: 0;
      display: none;
      pointer-events: none;
      grid-template-columns: 1fr 6px 1fr;
    }
    .vf-stage[data-vf-mode="half-frame"] .vf-hf-overlay { display: grid; }
    .vf-hf-slot {
      position: relative;
      border: 1px solid rgba(255,255,255,0.28);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .vf-hf-slot.waiting {
      background: rgba(6, 7, 10, 0.78);
    }
    .vf-hf-slot-badge {
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.6px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(0,0,0,0.68);
      color: rgba(255,255,255,0.72);
      border: 1px solid rgba(255,255,255,0.18);
    }
    .vf-hf-slot.locked .vf-hf-slot-badge {
      position: absolute;
      top: 6px;
      left: 6px;
      color: #22c55e;
      border-color: rgba(34, 197, 94, 0.55);
    }
    .vf-hf-slot.active-live {
      border-color: rgba(245, 166, 35, 0.7);
    }
    .vf-hf-divider {
      background: #030406;
    }

    /* EV Ruler Overlay on Viewfinder Top */
    .vf-top-hud {
      position: absolute;
      top: 8px;
      left: 10px;
      right: 10px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      z-index: 6;
      pointer-events: none;
    }
    .vf-badge-btn {
      pointer-events: auto;
      font-family: var(--mono);
      font-size: 9.5px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(10, 12, 16, 0.72);
      border: 1px solid rgba(255,255,255,0.2);
      color: #a1aab8;
      letter-spacing: 0.4px;
      backdrop-filter: blur(4px);
    }
    .vf-badge-btn.active {
      color: #f5a623;
      border-color: rgba(245, 166, 35, 0.7);
      background: rgba(245, 166, 35, 0.14);
    }
    .vf-ev-ruler-wrap {
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 148px;
      padding: 2px 6px 4px;
      border-radius: 6px;
      background: rgba(8, 10, 14, 0.5);
      backdrop-filter: blur(3px);
    }
    .vf-ev-ticks {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--mono);
      font-size: 9px;
      color: rgba(255,255,255,0.78);
      padding: 0 2px;
      margin-bottom: 2px;
    }
    #camExposureControl {
      width: 100%;
      height: 4px;
      margin: 0;
      background: rgba(255,255,255,0.22);
      border: none;
    }
    #camExposureControl::-webkit-slider-thumb {
      width: 12px;
      height: 12px;
      border-radius: 2px;
      background: #f5a623;
      border: 1px solid #111;
    }

    .vf-bottom-hud {
      position: absolute;
      bottom: 8px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      z-index: 6;
      pointer-events: none;
    }
    .vf-focal-pills {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 2px 4px;
      border-radius: 14px;
      background: rgba(8, 10, 14, 0.72);
      border: 1px solid rgba(255,255,255,0.16);
      backdrop-filter: blur(4px);
    }
    .vf-focal-btn {
      font-family: var(--mono);
      font-size: 9.5px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 10px;
      color: #cbd5e1;
      transition: all 0.14s ease;
    }
    .vf-focal-btn.active {
      background: #f5a623;
      color: #111;
    }

    .shutter-flash {
      position: absolute;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.08s;
      z-index: 10;
    }
    .shutter-flash.active { opacity: 0.85; }

    /* Rollie Bottom Shutter Deck */
    .cam-shutter-deck {
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 8px 12px 2px;
    }
    .cam-round-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 30%, #232730, #14171d);
      border: 2px solid #2d323e;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      color: #d1d5db;
      font-size: 16px;
    }
    .cam-round-btn:active { transform: scale(0.93); }
    .roll-count-badge {
      position: absolute;
      top: -3px;
      right: -3px;
      min-width: 17px;
      height: 17px;
      padding: 0 4px;
      border-radius: 9px;
      background: #f5a623;
      color: #111;
      font-family: var(--mono);
      font-size: 9.5px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .shutter-btn {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: #e8e6df;
      border: 4px solid #1e2128;
      outline: 2px solid #cfd2d9;
      box-shadow: 0 6px 18px rgba(0,0,0,0.75), inset 0 2px 4px rgba(255,255,255,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.08s ease;
    }
    .shutter-btn:active { transform: scale(0.92); }

    /* 3. FIXED BOTTOM TAB BAR */
    .bottom-nav {
      height: calc(46px + env(safe-area-inset-bottom));
      padding-bottom: env(safe-area-inset-bottom);
      flex-shrink: 0;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      background: #090b0e;
      border-top: 1px solid #1b1f27;
      z-index: 30;
    }
    .bnav-btn {
      min-width: 0;
      width: 100%;
      height: 46px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 600;
    }
    .bnav-btn .ico { font-size: 14px; line-height: 1; }
    .bnav-btn.active {
      color: #f5a623;
    }

    /* ==================== ROLLIE DOCKED COMBO PICKER (LIVE PREVIEW ABOVE) ==================== */
    .app-shell.picker-open #view-darkroom .tool-dock,
    .app-shell.picker-open #camComboTrio,
    .app-shell.picker-open .cam-shutter-deck,
    .app-shell.picker-open .bottom-nav {
      display: none;
    }
    .app-shell.picker-open .cam-wrap {
      padding: 4px 10px 6px;
    }
    .app-shell.picker-open .stage-area {
      padding: 4px 4px 6px;
    }

    .combo-dock-panel {
      display: none;
      flex-shrink: 0;
      width: 100%;
      background: #101217;
      border-top: 1px solid #2b303c;
      border-radius: 14px 14px 0 0;
      padding: 8px 10px calc(10px + env(safe-area-inset-bottom));
      box-shadow: 0 -8px 26px rgba(0, 0, 0, 0.58);
      z-index: 40;
    }
    .combo-dock-panel.open {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .sheet-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.72);
      backdrop-filter: blur(5px);
      display: none;
      align-items: flex-end;
      z-index: 80;
    }
    .sheet-backdrop.open { display: flex; }
    .sheet-card {
      width: 100%;
      max-height: 78vh;
      background: #111318;
      border-top: 1px solid #2b303c;
      border-radius: 18px 18px 0 0;
      padding: 12px 12px calc(16px + env(safe-area-inset-bottom));
      overflow-y: auto;
      scrollbar-width: none;
    }
    .sheet-card::-webkit-scrollbar { display: none; }
    .sheet-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-weight: 700;
      font-size: 13px;
    }
    .picker-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      min-height: 26px;
    }
    .picker-topbar-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .picker-topbar-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    /* Interactive Clapperboard Tab Box */
    .clapper-box {
      border: 1px solid #282c36;
      border-radius: 8px;
      overflow: hidden;
      background: #15181f;
    }
    .clapper-stripes {
      height: 7px;
      background: repeating-linear-gradient(
        -45deg,
        #e5e7eb,
        #e5e7eb 7px,
        #15181f 7px,
        #15181f 14px
      );
      border-bottom: 1px solid #282c36;
    }
    .clapper-cols {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .clapper-col {
      padding: 5px 8px 6px;
      border-right: 1px solid #222630;
      min-width: 0;
      text-align: left;
      position: relative;
      transition: background 0.15s ease;
    }
    .clapper-col:last-child { border-right: none; }
    .clapper-col.active {
      background: rgba(245, 166, 35, 0.12);
    }
    .clapper-col.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      background: #f5a623;
    }
    .clapper-col-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 4px;
      margin-bottom: 1px;
    }
    .clapper-col-lbl {
      font-family: var(--mono);
      font-size: 8.5px;
      font-weight: 700;
      color: #6c7586;
      letter-spacing: 0.7px;
    }
    .clapper-col.active .clapper-col-lbl {
      color: #f5a623;
    }
    .clapper-col-num {
      font-family: var(--mono);
      font-size: 8px;
      color: #6c7586;
    }
    .clapper-col-num strong { color: #d1d5db; }
    .clapper-col.active .clapper-col-num strong { color: #f5a623; }
    .clapper-col-val {
      font-size: 11px;
      font-weight: 700;
      color: #f3f4f6;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .clapper-col.film-col .clapper-col-val { color: #f5a623; }

    .picker-section {
      display: none;
      margin-bottom: 0;
    }
    .picker-section.active {
      display: block;
    }
    .picker-spec-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
      min-height: 18px;
      font-size: 10px;
    }
    .picker-spec-note {
      color: #a8b1bf;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }
    .picker-spec-stat {
      font-family: var(--mono);
      font-size: 9.5px;
      color: #f5a623;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Compact Visual Tiles inside Docked Clapperboard */
    .picker-tile {
      flex-shrink: 0;
      width: 88px;
      padding: 4px 4px 4px;
      border-radius: 9px;
      background: #171a21;
      border: 1.5px solid #242934;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 3px;
      text-align: center;
      opacity: 0.7;
      transition: border-color 0.14s ease, opacity 0.14s ease, background 0.14s ease;
    }
    .picker-tile .combo-card-art {
      height: 34px;
      margin-top: 0;
    }
    .picker-tile .combo-card-art svg,
    .picker-tile .combo-card-art img {
      height: 33px;
      max-width: 78px;
    }
    .picker-tile.active {
      opacity: 1;
      border-color: #f5a623;
      background: rgba(245, 166, 35, 0.11);
      box-shadow: 0 0 10px rgba(245, 166, 35, 0.18);
    }
    .picker-tile-name {
      font-size: 9.5px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 7px;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-primary);
    }
    .picker-tile.active .picker-tile-name {
      background: #f5a623;
      color: #111;
    }
    .picker-tile-sub {
      font-size: 8px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .filter-chip {
      flex-shrink: 0;
      padding: 3px 9px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 600;
      background: #181c24;
      border: 1px solid #292f3c;
      color: var(--text-secondary);
    }
    .filter-chip.active {
      background: #f5a623;
      color: #111;
      border-color: #f5a623;
      font-weight: 700;
    }

    .sample-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .sample-thumb {
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid transparent;
      aspect-ratio: 3 / 2;
    }
    .sample-thumb.active { border-color: #f5a623; }
    .sample-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .sample-thumb span {
      position: absolute;
      inset: auto 0 0 0;
      background: linear-gradient(transparent, rgba(0,0,0,0.88));
      font-size: 10px;
      font-weight: 600;
      padding: 8px 4px 3px;
      text-align: center;
    }
    .contact-grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .shot-card {
      background: #08090b;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .shot-card img { width: 100%; aspect-ratio: 3 / 2; object-fit: cover; display: block; }
    .shot-foot {
      padding: 5px 7px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--mono);
      font-size: 10px;
    }

    select { color-scheme: dark; }

    /* Toast */

  function drawCroppedSource(targetCtx, source, outW, outH, targetRatio, zoomFactor = 1.0) {
    const srcW = source.videoWidth || source.width || outW;

    const srcRatio = srcW / srcH;
    let sw = srcW, sh = srcH;
    if (srcRatio > targetRatio) sw = srcH * targetRatio;
    else sh = srcW / targetRatio;
    const z = Math.max(1.0, zoomFactor || 1.0);
    sw /= z;
    sh /= z;
    const sx = (srcW - sw) / 2;
    const sy = (srcH - sh) / 2;
    targetCtx.drawImage(source, sx, sy, sw, sh, 0, 0, outW, outH);
  }

  function getLabTargetDimensions(srcCanvas, maxDim) {

      return {
        w: Math.max(100, Math.round(srcCanvas.width * s)),
        h: Math.max(100, Math.round(srcCanvas.height * s)),
        ratio: srcCanvas.width / srcCanvas.height,
        zoom: 1.0

    }
    let ratio = getBodyAspect(body, lens);
    if (body.id !== 'half-frame' && body.id !== 'half-frame-single' && ratio > 1 && srcCanvas.height > srcCanvas.width) {

    const zoom = lens.cropZoom || 1.0;
    let w, h;
    if (ratio >= 1) {
      w = Math.min(maxDim, Math.max(180, Math.round(maxDim)));
      h = Math.max(120, Math.round(w / ratio));
    } else {
      h = Math.min(maxDim, Math.max(180, Math.round(maxDim)));
      w = Math.max(120, Math.round(h * ratio));
    }
    return { w, h, ratio, zoom };

  const SHUTTER_SOUND_PROFILES = {

    'medium-format': { level: 1.42, clickFreq: 2900, clickLevel: 0.20, impactDelay: 0.004, impactDuration: 0.072, impactFreq: 740, impactLevel: 0.50, curtainDelay: 0.020, curtainFreq: 2400, curtainLevel: 0.30, returnDelay: 0.098, returnFreq: 2650, returnLevel: 0.18, bodyFreq: 98, bodyLevel: 0.14, bodyTail: 0.15 }
  };

  function playShutterSound() {
    if (!state.camSound) return;
    try {
      if (!state.audioCtx) state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const ctx = state.audioCtx;
      const play = () => {
        const now = ctx.currentTime + 0.004;
        const sound = SHUTTER_SOUND_PROFILES[state.bodyId] || SHUTTER_SOUND_PROFILES.slr;
        const noiseClick = (offset, duration, frequency, q, peak) => {
          const length = Math.max(1, Math.floor(ctx.sampleRate * duration));
          const buffer = ctx.createBuffer(1, length, ctx.sampleRate);
          const samples = buffer.getChannelData(0);
          for (let i = 0; i < length; i++) samples[i] = Math.random() * 2 - 1;
          const source = ctx.createBufferSource(); source.buffer = buffer;
          const filter = ctx.createBiquadFilter(); filter.type = 'bandpass'; filter.frequency.value = frequency; filter.Q.value = q;
          const gain = ctx.createGain(), start = now + offset;
          gain.gain.setValueAtTime(0.0001, start);
          gain.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak * sound.level), start + Math.min(0.0025, duration * 0.2));
          gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
          source.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
          source.start(start); source.stop(start + duration + 0.005);
        };

        noiseClick(0, 0.016, sound.clickFreq, 0.8, sound.clickLevel);
        noiseClick(sound.impactDelay, sound.impactDuration, sound.impactFreq, 0.55, sound.impactLevel);
        noiseClick(sound.curtainDelay, 0.032, sound.curtainFreq, 1.1, sound.curtainLevel);
        noiseClick(sound.returnDelay, 0.024, sound.returnFreq, 0.9, sound.returnLevel);

        const resonance = ctx.createOscillator(), bodyGain = ctx.createGain();
        resonance.type = 'triangle';
        resonance.frequency.setValueAtTime(sound.bodyFreq, now + 0.006);
        resonance.frequency.exponentialRampToValueAtTime(sound.bodyFreq * 0.68, now + sound.bodyTail);
        bodyGain.gain.setValueAtTime(0.0001, now + 0.006);
        bodyGain.gain.exponentialRampToValueAtTime(sound.bodyLevel * sound.level, now + 0.014);
        bodyGain.gain.exponentialRampToValueAtTime(0.0001, now + sound.bodyTail);
        resonance.connect(bodyGain); bodyGain.connect(ctx.destination);
        resonance.start(now + 0.006); resonance.stop(now + sound.bodyTail + 0.005);
      };
      if (ctx.state === 'suspended') ctx.resume().then(play).catch(() => {});
      else play();
    } catch (e) {}
  }

  function getCameraStageDimensions(body, lens) {
    if (body.id === 'half-frame') return { w: 420, h: 280, ratio: 3 / 2 };
    if (body.id === 'half-frame-single') return { w: 240, h: 320, ratio: 3 / 4 };
    if (body.id === 'pocket-110') return { w: 400, h: 300, ratio: 4 / 3 };
    if (body.id === 'medium-format') {
      if (lens.id === '6x45') return { w: 400, h: 300, ratio: 4 / 3 };
      if (lens.id === '6x7') return { w: 350, h: 300, ratio: 7 / 6 };
      return { w: 320, h: 320, ratio: 1 };
    }
    return { w: 420, h: 280, ratio: 3 / 2 };
  }

  function getCameraCaptureDimensions(body, lens) {
    if (body.id === 'half-frame-single') return { w: 960, h: 1280, ratio: 3 / 4 };
    if (body.id === 'pocket-110') return { w: 1280, h: 960, ratio: 4 / 3 };
    if (body.id === 'medium-format') {
      if (lens.id === '6x45') return { w: 1280, h: 960, ratio: 4 / 3 };
      if (lens.id === '6x7') return { w: 1260, h: 1080, ratio: 7 / 6 };
      return { w: 1200, h: 1200, ratio: 1 };
    }
    return { w: 1280, h: 853, ratio: 3 / 2 };
  }

  function layoutViewfinderStage() {
    const box = document.getElementById('camVfBox');
    const stage = document.getElementById('vfStage');
    if (!box || !stage) return;
    const { body, lens } = getSelectedGear();
    stage.dataset.vfMode = body.id;

    const targetRatio = getCameraStageDimensions(body, lens).ratio;
    const bw = box.clientWidth;
    const bh = box.clientHeight;
    if (bw > 20 && bh > 20) {
      let w = bw;
      let h = w / targetRatio;
      if (h > bh) {
        h = bh;
        w = h * targetRatio;
      }
      stage.style.width = `${Math.round(w)}px`;
      stage.style.height = `${Math.round(h)}px`;
    }

    if (body.id === 'rangefinder') {
      const bl = document.getElementById('vfRfBrightline');
      const ft = document.getElementById('vfRfFocalTag');
      const pct = lens.brightlinePct || 70.4;
      if (bl) {
        bl.style.width = `${pct}%`;
        bl.style.height = `${pct}%`;
      }
      if (ft) ft.textContent = lens.label;
    }

    if (body.id === 'slr') {
      const ev = Number(state.camExposureEV) || 0;
      const activeLed = ev >= 1.15 ? 'over2' : (ev >= 0.4 ? 'over1' : (ev <= -1.15 ? 'under2' : (ev <= -0.4 ? 'under1' : 'ok')));
      document.querySelectorAll('#vfSlrLedBar .vf-led-row').forEach(row => {
        row.classList.toggle('lit', row.dataset.led === activeLed);
      });
    }

    if (body.id === 'disposable') {
      document.getElementById('vfDispFlashPip')?.classList.toggle('on', !!state.camFlashOn);
    }

    if (body.id === 'half-frame') {
      const leftSlot = document.getElementById('vfHfLeft');
      const rightSlot = document.getElementById('vfHfRight');
      const leftBadge = document.getElementById('vfHfLeftBadge');
      const rightBadge = document.getElementById('vfHfRightBadge');
      if (state.hfStep === 2) {
        leftSlot?.classList.remove('active-live', 'waiting');
        leftSlot?.classList.add('locked');
        rightSlot?.classList.remove('waiting', 'locked');
        rightSlot?.classList.add('active-live');
        if (leftBadge) leftBadge.textContent = '1/2 HELD';
        if (rightBadge) rightBadge.textContent = 'FRAME 2/2';
      } else {
        leftSlot?.classList.remove('locked', 'waiting');
        leftSlot?.classList.add('active-live');
        rightSlot?.classList.remove('active-live', 'locked');
        rightSlot?.classList.add('waiting');
        if (leftBadge) leftBadge.textContent = 'FRAME 1/2';
        if (rightBadge) rightBadge.textContent = '2/2 NEXT';
      }
    }
  }

  function syncCameraHudUI() {

  let cameraSettingsTimer = 0;
  function scheduleCameraSettingsApply() {
    window.clearTimeout(cameraSettingsTimer);
    cameraSettingsTimer = window.setTimeout(() => applyCameraHardwareSettings(), 140);
  }

  async function applyCameraHardwareSettings() {
    const track = cameraTrack();
    if (!track || !track.applyConstraints) return;
    let capabilities = null;
    try { capabilities = track.getCapabilities?.() || null; } catch (error) {}
    state.camTrackCapabilities = capabilities;
    if (!capabilities) return;

    const advanced = {};
    if (capabilities.exposureCompensation) {
      const min = capabilities.exposureCompensation.min ?? -2;
      const max = capabilities.exposureCompensation.max ?? 2;
      advanced.exposureCompensation = Math.max(min, Math.min(max, Number(state.camExposureEV) || 0));
    }
    const { film } = getSelectedGear();
    if (capabilities.iso && Number.isFinite(capabilities.iso.min) && Number.isFinite(capabilities.iso.max)) {
      advanced.iso = Math.max(capabilities.iso.min, Math.min(capabilities.iso.max, film.iso));
    }
    state.camAppliedHardware = {};
    if (Object.keys(advanced).length) {
      try {
        await track.applyConstraints({ advanced: [advanced] });
        Object.keys(advanced).forEach(key => { state.camAppliedHardware[key] = true; });
      } catch (error) {
        for (const [key, value] of Object.entries(advanced)) {
          try { await track.applyConstraints({ advanced: [{ [key]: value }] }); state.camAppliedHardware[key] = true; } catch (ignored) {}
        }
      }
    }
  }

  async function startRealCamera() {
    if (state.camStream?.getTracks().some(track => track.readyState === 'live')) {
      document.getElementById('camSourceStatus').textContent = state.camFacing === 'environment' ? 'Rear' : 'Front';
      return;
    }
    document.getElementById('camSourceStatus').textContent = 'Opening…';
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: state.camFacing, width: { ideal: 1280 }, height: { ideal: 960 } }, audio: false });
      if (!document.getElementById('view-camera').classList.contains('active')) {
        stream.getTracks().forEach(track => track.stop());
        return;
      }
      state.camStream = stream;
      camVideo.srcObject = stream;
      await camVideo.play();
      await applyCameraHardwareSettings();
      document.getElementById('camSourceStatus').textContent = state.camFacing === 'environment' ? 'Rear' : 'Front';
    } catch (e) {
      if (state.camStream) state.camStream.getTracks().forEach(track => track.stop());
      state.camStream = null;
      camVideo.srcObject = null;
      document.getElementById('camSourceStatus').textContent = 'Simulated';
    }
  }

  function startCameraLoop() {
    if (state.camAnimId) return;
    const tmp = document.createElement('canvas');
    const tCtx = tmp.getContext('2d'), vfCtx = vfCanvas.getContext('2d');
    let last = 0;
    const loop = (ts) => {
      state.camAnimId = requestAnimationFrame(loop);
      if (ts - last < 55) return;
      last = ts;

      const hasLiveVideo = !!(state.camStream && camVideo.readyState >= 2);
      const src = hasLiveVideo ? camVideo : state.previewSourceCanvas;
      if (!src) return;

      const { phone, body, lens, film } = getSelectedGear();
      const stageDim = getCameraStageDimensions(body, lens);
      const targetW = stageDim.w;
      const targetH = stageDim.h;
      if (vfCanvas.width !== targetW || vfCanvas.height !== targetH) {
        vfCanvas.width = targetW;
        vfCanvas.height = targetH;
      }

      if (body.id === 'half-frame') {
        const slotW = 206, slotH = 280;
        if (tmp.width !== slotW || tmp.height !== slotH) { tmp.width = slotW; tmp.height = slotH; }
        tCtx.clearRect(0, 0, slotW, slotH);
        drawCroppedSource(tCtx, src, slotW, slotH, 3 / 4, lens.cropZoom || 1.0);
        const version = ++cameraPreviewFrameVersion;
        processFilmImage(tCtx.getImageData(0, 0, slotW, slotH), slotW, slotH, {
          phone, body, lens, film, strength: 100, exposureEV: cameraExposureEV(), warmth: state.warmth,
          grainAmt: Math.round(film.grainBase * 0.65), halationAmt: Math.round(film.halationBase * 0.6),
          bloomAmt: lens.bloomBase, vignetteAmt: lens.vignetteBase, leakType: 'none', leakAmt: 0, frameType: 'none', dateStampText: formatDateStamp(), frameNumberStr: '',
          flashBurst: false
        }, { output: 'bitmap', coalesceKey: 'camera-preview' }).then(output => {
          if (!output || version !== cameraPreviewFrameVersion) { output?.bitmap?.close(); return; }
          const liveImg = output.bitmap || output.canvas;
          vfCtx.fillStyle = '#050608';
          vfCtx.fillRect(0, 0, targetW, targetH);
          if (state.hfStep === 2 && state.hfFirstPreviewCanvas) {
            vfCtx.drawImage(state.hfFirstPreviewCanvas, 0, 0, slotW, slotH);
            vfCtx.drawImage(liveImg, targetW - slotW, 0, slotW, slotH);
          } else {
            vfCtx.drawImage(liveImg, 0, 0, slotW, slotH);
          }
          output.bitmap?.close();
        }).catch(() => {});
        return;
      }

      if (tmp.width !== targetW || tmp.height !== targetH) { tmp.width = targetW; tmp.height = targetH; }
      const vfRatio = stageDim.ratio;
      const vfZoom = body.id === 'rangefinder' ? 1.0 : (lens.cropZoom || 1.0);
      drawCroppedSource(tCtx, src, targetW, targetH, vfRatio, vfZoom);

      const version = ++cameraPreviewFrameVersion;
      processFilmImage(tCtx.getImageData(0, 0, targetW, targetH), targetW, targetH, {
        phone, body, lens, film, strength: 100, exposureEV: cameraExposureEV(), warmth: state.warmth,
        grainAmt: Math.round(film.grainBase * 0.65), halationAmt: Math.round(film.halationBase * 0.6),
        bloomAmt: lens.bloomBase, vignetteAmt: lens.vignetteBase, leakType: 'none', leakAmt: 0, frameType: 'none', dateStampText: formatDateStamp(), frameNumberStr: '',
        flashBurst: body.id === 'disposable' && state.camFlashOn
      }, { output: 'bitmap', coalesceKey: 'camera-preview' }).then(output => {
        if (!output || version !== cameraPreviewFrameVersion) { output?.bitmap?.close(); return; }
        vfCtx.drawImage(output.bitmap || output.canvas, 0, 0);
        output.bitmap?.close();
      }).catch(() => {});
    };
    state.camAnimId = requestAnimationFrame(loop);
  }

  function stopCameraLoop() {
    if (state.camAnimId) { cancelAnimationFrame(state.camAnimId); state.camAnimId = null; }
  }

  function stopRealCamera() {
    if (state.camStream) state.camStream.getTracks().forEach(track => track.stop());
    state.camStream = null;
    state.camTrackCapabilities = null;
    state.camAppliedHardware = {};
    camVideo.srcObject = null;
  }

  function pauseCameraWhenHidden() {
    stopCameraLoop();
    if (state.camStream) stopRealCamera();
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) pauseCameraWhenHidden();
    else if (document.getElementById('view-camera').classList.contains('active')) { startCameraLoop(); startRealCamera(); layoutViewfinderStage(); }
  });
  window.addEventListener('pagehide', pauseCameraWhenHidden);
  window.addEventListener('beforeunload', pauseCameraWhenHidden);
  window.addEventListener('resize', layoutViewfinderStage);

  async function createShotThumbnail(blob) {
    const bitmap = await createImageBitmap(blob);
    const scale = Math.min(1, 360 / Math.max(bitmap.width, bitmap.height));
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(bitmap.width * scale));
    canvas.height = Math.max(1, Math.round(bitmap.height * scale));
    canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    bitmap.close();
    return canvasToJpegBlob(canvas, 0.72);
  }

  async function saveCameraExposure(rawBlob, shotNumber, opts = {}) {
    const rawBitmap = await createImageBitmap(rawBlob);
    const scale = Math.min(1, 1440 / Math.max(rawBitmap.width, rawBitmap.height));
    const capW = Math.max(1, Math.round(rawBitmap.width * scale));
    const capH = Math.max(1, Math.round(rawBitmap.height * scale));
    const capC = document.createElement('canvas'); capC.width = capW; capC.height = capH;
    const cCtx = capC.getContext('2d');
    cCtx.drawImage(rawBitmap, 0, 0, capW, capH); rawBitmap.close();
    const { phone, body, lens, film } = getSelectedGear();
    const numStr = `${String(shotNumber).padStart(2, '0')}A`;
    const processed = await processFilmImage(cCtx.getImageData(0, 0, capW, capH), capW, capH, {
      phone, body, lens, film, strength: 100, exposureEV: cameraExposureEV(), warmth: state.warmth,
      grainAmt: film.grainBase, halationAmt: film.halationBase, bloomAmt: lens.bloomBase, vignetteAmt: lens.vignetteBase,
      leakType: state.leakType, leakAmt: state.leakAmt, frameType: state.frameType, dateStampText: formatDateStamp(), frameNumberStr: numStr,
      flashBurst: body.id === 'disposable' && state.camFlashOn
    }, { output: 'blob', quality: 0.92 });
    const photoBlob = processed.blob;
    const thumbnailBlob = await createShotThumbnail(photoBlob);
    const shot = { id: createRollId(), rollId: state.camRollId, rollNumber: state.camRollNumber, num: shotNumber, createdAt: Date.now(), filmName: film.name, isDiptych: !!opts.isDiptych, rawBlob, photoBlob, thumbnailBlob };
    let persisted = true;
    try { await storeCameraRollShot(shot); } catch (error) { persisted = false; }

    // Automatic film advance & automatic new roll after 36 frames
    if (shotNumber >= state.camMaxShots) {
      state.camRollNumber += 1;
      state.camRollId = createRollId();
      state.camShotCount = 0;
    } else {
      state.camShotCount = shotNumber;
    }
    state.camIsCocked = true;
    state.camRollRewound = false;
    saveCameraRollMeta();

    state.camRollShots.unshift(persisted
      ? { id: shot.id, rollId: shot.rollId, rollNumber: shot.rollNumber, num: shot.num, createdAt: shot.createdAt, filmName: shot.filmName, isDiptych: shot.isDiptych, thumbnailBlob: shot.thumbnailBlob }
      : shot);
    syncAllUI();
    renderContactSheet();
    showToast(opts.isDiptych
      ? `🎞️ Diptych #${String(shotNumber).padStart(2, '0')} saved to Roll`
      : `🎞️ Shot #${String(shotNumber).padStart(2, '0')} saved to Roll`);
  }

  let cameraRollReady = Promise.resolve();
  let shutterBusy = false;
  async function captureCameraShot() {
    if (shutterBusy) return;
    if (!state.camStream && !state.fullSourceCanvas) {
      await startRealCamera();
      return;
    }
    shutterBusy = true;
    const shutterButton = document.getElementById('btnShutter');
    shutterButton.disabled = true;
    await cameraRollReady;

    const fl = document.getElementById('shutterFlash');
    fl.classList.add('active'); setTimeout(() => fl.classList.remove('active'), 110);
    playShutterSound();

    try {
      const { phone, body, lens, film } = getSelectedGear();
      const hasLiveVideo = !!(state.camStream && camVideo.readyState >= 2);
      const src = hasLiveVideo ? camVideo : (state.fullSourceCanvas || SAMPLES[0].canvas);
      const capZoom = lens.cropZoom || 1.0;

      if (body.id === 'half-frame') {
        const halfW = 712, halfH = 960;
        const singleC = document.createElement('canvas');
        singleC.width = halfW; singleC.height = halfH;
        drawCroppedSource(singleC.getContext('2d'), src, halfW, halfH, 3 / 4, capZoom);

        if (state.hfStep === 1) {
          state.hfFirstRawCanvas = singleC;
          const prevW = 206, prevH = 280;
          const prevC = document.createElement('canvas');
          prevC.width = prevW; prevC.height = prevH;
          const pCtx = prevC.getContext('2d');
          pCtx.drawImage(singleC, 0, 0, prevW, prevH);
          const processedPrev = await processFilmImage(pCtx.getImageData(0, 0, prevW, prevH), prevW, prevH, {
            phone, body, lens, film, strength: 100, exposureEV: cameraExposureEV(), warmth: state.warmth,
            grainAmt: Math.round(film.grainBase * 0.65), halationAmt: Math.round(film.halationBase * 0.6),
            bloomAmt: lens.bloomBase, vignetteAmt: lens.vignetteBase, leakType: 'none', leakAmt: 0, frameType: 'none', dateStampText: formatDateStamp(), frameNumberStr: '',
            flashBurst: false
          }, { output: 'bitmap' });
          if (processedPrev) {
            const img = processedPrev.bitmap || processedPrev.canvas;
            pCtx.drawImage(img, 0, 0, prevW, prevH);
            processedPrev.bitmap?.close();
          }
          state.hfFirstPreviewCanvas = prevC;
          state.hfStep = 2;
          syncAllUI();
          showToast('🎞️ Frame 1/2 saved — shoot Frame 2');
        } else {
          const gap = 16;
          const dipC = document.createElement('canvas');
          dipC.width = halfW * 2 + gap;
          dipC.height = halfH;
          const dCtx = dipC.getContext('2d');
          dCtx.fillStyle = '#07080a';
          dCtx.fillRect(0, 0, dipC.width, dipC.height);
          if (state.hfFirstRawCanvas) dCtx.drawImage(state.hfFirstRawCanvas, 0, 0, halfW, halfH);
          dCtx.drawImage(singleC, halfW + gap, 0, halfW, halfH);
          const rawBlob = await canvasToJpegBlob(dipC, 0.92);
          resetHalfFramePending();
          const shotNumber = (state.camShotCount % state.camMaxShots) + 1;
          await saveCameraExposure(rawBlob, shotNumber, { isDiptych: true });
        }
        return;
      }

      const shotNumber = (state.camShotCount % state.camMaxShots) + 1;
      const capDim = getCameraCaptureDimensions(body, lens);
      const capC = document.createElement('canvas');
      capC.width = capDim.w; capC.height = capDim.h;
      drawCroppedSource(capC.getContext('2d'), src, capDim.w, capDim.h, capDim.ratio, capZoom);
      const rawBlob = await canvasToJpegBlob(capC, 0.92);
      await saveCameraExposure(rawBlob, shotNumber, { isDiptych: false });
    } catch (error) {
      showToast('Could not process this shot');
    } finally {
      shutterBusy = false;
      shutterButton.disabled = false;
    }
  }

  const cameraThumbUrls = new Set();
  function renderContactSheet() {
    cameraThumbUrls.forEach(url => URL.revokeObjectURL(url));
    cameraThumbUrls.clear();
    document.getElementById('contactCount').textContent = state.camRollShots.length;
    const grid = document.getElementById('contactSheetGrid');
    if (state.camRollShots.length === 0) {
      grid.innerHTML = `<div style="grid-column:1/-1;color:var(--text-muted);font-size:11.5px;padding:12px 0;">No photos on this roll yet. Tap the shutter in Camera to shoot!</div>`;
      return;
    }
    grid.innerHTML = '';
    state.camRollShots.forEach(s => {
      const card = document.createElement('div');
      card.className = 'shot-card';
      const thumbnailUrl = URL.createObjectURL(s.thumbnailBlob);
      cameraThumbUrls.add(thumbnailUrl);
      card.innerHTML = `
        <img src="${thumbnailUrl}" alt="Shot ${s.num}" />
        <div class="shot-foot">
          <span>R${s.rollNumber || 1} · #${String(s.num).padStart(2, '0')}</span>
          <div style="display:flex;gap:4px;">
            <button class="btn-pill btn-ghost btn-edit" style="height:24px;padding:0 7px;font-size:10.5px;">Lab</button>
            <button class="btn-pill btn-brass btn-save-shot" type="button" style="height:24px;padding:0 7px;font-size:10.5px;">Save</button>
          </div>
        </div>
      `;
      card.querySelector('.btn-edit').addEventListener('click', async () => {
        try {
          const files = s.rawBlob ? s : await loadCameraRollFiles(s.id);
          if (!files?.rawBlob) throw new Error('Original photo is unavailable');
          document.getElementById('contactSheetBackdrop').classList.remove('open');
          const bitmap = await createImageBitmap(files.rawBlob);
          const source = document.createElement('canvas');
          source.width = bitmap.width; source.height = bitmap.height;
          source.getContext('2d').drawImage(bitmap, 0, 0);
          bitmap.close();
          loadSourceCanvas(source, null, { isDiptych: !!s.isDiptych });
          switchMainTab('darkroom');
          showToast(`Shot #${s.num} opened in Lab`);
        } catch (error) { showToast('Could not open the original photo'); }
      });
      card.querySelector('.btn-save-shot').addEventListener('click', () => saveRollPhoto(s));
      grid.appendChild(card);
    });
  }

  async function restoreCameraRoll() {
    try {
      const savedShots = await loadCameraRollFromStorage();
      state.camRollShots = savedShots.reverse();
      renderContactSheet();
      syncCameraHudUI();
    } catch (error) {}
  }

  async function saveRollPhoto(shot) {
    const filename = `tees-lab-roll-${shot.rollNumber || 1}-shot-${String(shot.num).padStart(2, '0')}.jpg`;
    try {
      const files = shot.photoBlob ? shot : await loadCameraRollFiles(shot.id);
      const blob = files?.photoBlob;
      if (!blob) throw new Error('Processed photo is unavailable');
      const imageFile = new File([blob], filename, { type: 'image/jpeg' });
      if (navigator.share && (!navigator.canShare || navigator.canShare({ files: [imageFile] }))) {
        showToast('Choose “Save Image” in the share sheet to save to Photos');
        await navigator.share({ files: [imageFile], title: `Tee's Lab shot #${shot.num}` });
        return;
      }
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url; link.download = filename; link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      showToast('Image downloaded');
    } catch (error) {
      if (error?.name === 'AbortError') { showToast('Save cancelled'); return; }
      showToast('Could not save this photo');
    }
  }

  /* ==========================================================================
     9. NAVIGATION & EVENTS
     ========================================================================== */

  function switchMainTab(tabId) {
    if (!tabId) return;
    document.querySelectorAll('.bnav-btn[data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab === tabId));
    document.querySelectorAll('.view-section').forEach(s => s.classList.toggle('active', s.id === `view-${tabId}`));
    if (tabId === 'camera') { syncAllUI(); requestAnimationFrame(layoutViewfinderStage); startCameraLoop(); startRealCamera(); }
    else { stopCameraLoop(); if (state.camStream) stopRealCamera(); }
  }

  async function handleImageFile(file) {
    if (!file) return;
    try {
      const buf = await file.arrayBuffer();
      const exif = parseExifFromArrayBuffer(buf);
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        URL.revokeObjectURL(url);
        const scale = Math.min(1, 2400 / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * scale);
        c.height = Math.round(img.naturalHeight * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        state.activeSampleId = null;
        renderSampleStrip();
        loadSourceCanvas(c, exif);
        switchMainTab('darkroom');
        showToast('Photo loaded');
      };
      img.onerror = () => { URL.revokeObjectURL(url); showToast('❌ Unsupported image format'); };
      img.src = url;
    } catch (e) {
      showToast('❌ Could not read the image file');
    }
  }

  async function exportFullResolution() {
    if (!state.fullSourceCanvas) return;
    showToast('⏳ Saving high-quality image...');
    const src = buildLabCroppedCanvas(state.fullSourceCanvas, 2400);
    const { phone, body, lens, film } = getSelectedGear();
    let blob;
    try {
      const sourceData = src.getContext('2d').getImageData(0, 0, src.width, src.height);
      const output = await processFilmImage(sourceData, src.width, src.height, {
        phone, body, lens, film, strength: state.strength, exposureEV: state.exposure / 100, warmth: state.warmth,
        grainAmt: state.grain, halationAmt: state.halation, bloomAmt: state.bloom, vignetteAmt: state.vignette,
        leakType: state.leakType, leakAmt: state.leakAmt, frameType: state.frameType, dateStampText: formatDateStamp(), frameNumberStr: '36',
        flashBurst: body.id === 'disposable' && state.camFlashOn
      }, { output: 'blob', quality: 0.94 });
      blob = output.blob;
    } catch (error) { showToast('❌ Could not process this image'); return; }
    if (!blob) { showToast('❌ Could not create image file'); return; }

    const filename = `tees-lab-${film.id}-${Date.now()}.jpg`;
    const imageFile = new File([blob], filename, { type: 'image/jpeg' });
    try {
      if (navigator.share && (!navigator.canShare || navigator.canShare({ files: [imageFile] }))) {
        showToast('Choose “Save Image” in the share sheet to save to Photos');
        await navigator.share({ files: [imageFile], title: "Tee's Lab photo" });
        return;
      }
    } catch (error) {
      if (error?.name === 'AbortError') { showToast('Save cancelled'); return; }
    }

    const u = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = u; a.download = filename; a.click();
    setTimeout(() => URL.revokeObjectURL(u), 1000);
    showToast('✅ Image downloaded');
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  }
